<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎂 Happy Birthday 🎂</h1>

        <img src="1.jpg" alt="Ảnh sinh nhật">

        <p>
            Chúc mừng sinh nhật! ❤️
            <br><br>
            Chúc bạn luôn vui vẻ, hạnh phúc,
            gặp nhiều may mắn và đạt được mọi điều mình mong muốn.
            Mong tuổi mới sẽ là một năm thật tuyệt vời!
        </p>

        <button onclick="playMusic()">🎵 Bật nhạc</button>

        <audio id="music">
            <source src="happybirthday.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ phát âm thanh.
        </audio>

    </div>

    <script src="script.js"></script>

</body>

</html>
